name: Verify Alloy construction

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/packages/alloy/**'
      - 'job/package.json'
      - 'job/pnpm-workspace.yaml'
      - 'job/pnpm-lock.yaml'
      - 'job/toolchains.lock.json'
      - '.github/workflows/verify-alloy.yml'

permissions:
  contents: write

concurrency:
  group: verify-alloy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-alloy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Verify Alloy token contracts
        working-directory: job
        run: node --test packages/alloy/test/*.test.mjs

      - name: Verify generated Alloy contracts are current
        working-directory: job
        run: |
          set -euo pipefail
          node packages/alloy/scripts/build-tokens.mjs
          git diff --exit-code -- packages/alloy/generated

      - name: Activate pnpm 12.3.4
        working-directory: job
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          test "$(pnpm --version)" = "12.3.4"

      - name: Generate and verify Task 8.4 lockfile
        working-directory: job
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm --filter @machina/alloy typecheck
          pnpm --filter @machina/alloy test

      - name: Persist runner-generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- job/pnpm-lock.yaml; then
            echo 'runner-generated lockfile already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add job/pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'build(alloy): materialize pnpm 12.3.4 lockfile'
          git push origin HEAD:forge/mch-s001-1.0.0
