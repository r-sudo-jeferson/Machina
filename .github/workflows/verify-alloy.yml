name: Verify Alloy construction

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/packages/alloy/**'
      - 'job/package.json'
      - 'job/pnpm-workspace.yaml'
      - 'job/pnpm-lock.yaml'
      - 'job/toolchains.lock.json'
      - '.github/workflows/verify-alloy.yml'

permissions:
  contents: read

concurrency:
  group: verify-alloy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-alloy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Verify Alloy token contracts
        working-directory: job
        run: node --test packages/alloy/test/*.test.mjs

      - name: Verify generated Alloy contracts are current
        working-directory: job
        run: |
          set -euo pipefail
          node packages/alloy/scripts/build-tokens.mjs
          git diff --exit-code -- packages/alloy/generated

      - name: Activate pnpm 12.3.4
        working-directory: job
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          test "$(pnpm --version)" = "12.3.4"

      - name: Install frozen Alloy workspace
        working-directory: job
        run: pnpm install --frozen-lockfile

      - name: Test Alloy package first pass
        working-directory: job
        run: pnpm --filter @machina/alloy test

      - name: Typecheck Alloy package
        working-directory: job
        run: pnpm --filter @machina/alloy typecheck

      - name: Test Alloy package second pass
        working-directory: job
        run: pnpm --filter @machina/alloy test

      - name: Build Alloy Storybook
        working-directory: job
        run: pnpm --filter @machina/alloy build-storybook

      - name: Capture Alloy visual critic evidence
        working-directory: job
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: pnpm --filter @machina/alloy critic:evidence

      - name: Upload Alloy visual critic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alloy-storybook-critic-${{ github.sha }}
          path: job/packages/alloy/critic-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
