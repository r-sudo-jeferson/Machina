name: Verify repository secrets

on:
  push:
    branches:
      - forge/mch-s001-1.0.0

permissions:
  contents: read

concurrency:
  group: verify-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full construction history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify repository secret boundary
        env:
          GOTOOLCHAIN: local
        run: bash job/scripts/secretstest/run.sh
