name: Bootstrap web lockfile

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/apps/web/package.json'
      - '.github/workflows/bootstrap-web-lockfile.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-web-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Activate pnpm 12.3.4
        working-directory: job
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          test "$(pnpm --version)" = "12.3.4"

      - name: Resolve lockfile only
        working-directory: job
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit deterministic lock update
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no -- . ':!job/pnpm-lock.yaml')"
          if git diff --quiet -- job/pnpm-lock.yaml; then
            echo 'lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add job/pnpm-lock.yaml
          git commit -m 'chore(web): resolve pinned task 9 dependencies'
          git push origin HEAD:forge/mch-s001-1.0.0
