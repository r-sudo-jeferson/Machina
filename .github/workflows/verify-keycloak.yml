name: Verify Keycloak preview

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/deploy/keycloak/**'
      - 'job/scripts/keycloaktest/**'
      - 'job/internal/platform/identity/*keycloak*'
      - 'job/toolchains.lock.json'
      - '.github/workflows/verify-keycloak.yml'

permissions:
  contents: read

concurrency:
  group: verify-keycloak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-keycloak:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Keycloak preview configuration contract
        working-directory: job
        run: go test -count=1 ./scripts/keycloaktest

      - name: Verify locked Keycloak provider integration from clean environment
        working-directory: job
        run: |
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            GOTOOLCHAIN=local \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            bash scripts/keycloaktest/run.sh
