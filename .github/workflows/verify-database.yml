name: Verify PostgreSQL construction

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/db/migrations/**'
      - 'job/scripts/dbtest/**'
      - '.github/workflows/verify-database.yml'

permissions:
  contents: read

concurrency:
  group: verify-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Verify PostgreSQL 18.6 tenancy and identity kernel
        working-directory: job
        run: bash scripts/dbtest/run.sh
