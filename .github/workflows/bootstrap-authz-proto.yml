name: Bootstrap authz Go protobuf bindings

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - '.github/workflows/bootstrap-authz-proto.yml'

permissions:
  contents: write

jobs:
  bootstrap-authz-proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false

      - name: Generate exact authz Go bindings
        working-directory: job
        run: bash ./scripts/protogen/run.sh generate

      - name: Commit generated bindings only
        run: |
          set -euo pipefail
          git add -- job/gen/authz/v1/authz.pb.go job/gen/authz/v1/authz_grpc.pb.go
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | sort)" = $'job/gen/authz/v1/authz.pb.go\njob/gen/authz/v1/authz_grpc.pb.go'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(proto): generate authz Go bindings'
          git push origin HEAD:forge/mch-s001-1.0.0
