name: Verify Rust authorization

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/Cargo.toml'
      - 'job/Cargo.lock'
      - 'job/services/authz/**'
      - 'job/db/migrations/**'
      - 'job/scripts/authztest/**'
      - 'job/scripts/authzperf/**'
      - 'job/docs/engineering/MCH-S001-authz-performance.md'
      - '.github/workflows/verify-authz.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'job/Cargo.toml'
      - 'job/Cargo.lock'
      - 'job/services/authz/**'
      - 'job/db/migrations/**'
      - 'job/scripts/authztest/**'
      - 'job/scripts/authzperf/**'
      - 'job/docs/engineering/MCH-S001-authz-performance.md'
      - '.github/workflows/verify-authz.yml'

permissions:
  contents: read

concurrency:
  group: verify-authz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verification ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_event=%s\n' "$GITHUB_EVENT_NAME"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Verify locked Rust 1.98.1 authorization service
        working-directory: job
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.98.1 --component clippy --component rustfmt
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          cargo +1.98.1 metadata --locked --format-version 1 >/dev/null
          cargo +1.98.1 fmt --all --check
          cargo +1.98.1 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.1 test --locked --workspace --all-targets

      - name: Verify PostgreSQL-backed policy loading
        working-directory: job
        run: bash scripts/authztest/run.sh

      - name: Verify authorization performance objective
        if: github.event_name == 'push'
        working-directory: job
        run: bash scripts/authzperf/run.sh
