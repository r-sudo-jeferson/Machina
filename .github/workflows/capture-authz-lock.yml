name: Import Rust authorization lock

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - '.github/workflows/capture-authz-lock.yml'

permissions:
  actions: read
  contents: write

jobs:
  import-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Import exact captured Cargo.lock
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10031521292'
          EXPECTED_SHA256: '6c4f845c91200af2a1a557a24a6870269b14a657a2975a1624fa76559f268728'
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/authz-lock.zip
          unzip -p /tmp/authz-lock.zip Cargo.lock > /tmp/Cargo.lock
          printf '%s  %s\n' "${EXPECTED_SHA256}" /tmp/Cargo.lock | sha256sum --check --strict -

          lock_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/job/Cargo.lock?ref=${GITHUB_REF_NAME}" \
            | jq --raw-output '.sha')"
          test -n "${lock_sha}"
          test "${lock_sha}" != 'null'

          jq --null-input \
            --arg message 'build(authz): pin protobuf gRPC dependency graph' \
            --arg content "$(base64 --wrap=0 /tmp/Cargo.lock)" \
            --arg sha "${lock_sha}" \
            --arg branch "${GITHUB_REF_NAME}" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' \
            > /tmp/update-lock.json

          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/update-lock.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/job/Cargo.lock" \
            > /tmp/update-result.json

          jq --exit-status '.commit.sha and .content.sha' /tmp/update-result.json >/dev/null
