name: Verify authz Go protobuf generation

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/contracts/proto/authz/v1/authz.proto'
      - 'job/gen/authz/v1/**'
      - 'job/scripts/protogen/**'
      - '.github/workflows/verify-authz-proto.yml'

permissions:
  contents: read

concurrency:
  group: verify-authz-proto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-authz-proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify generated authz Go protobuf
        working-directory: job
        run: bash ./scripts/protogen/run.sh --check
