name: Machina FOS-003 Workspace CLI Diagnostic

on:
  push:
    branches:
      - forge/private-source-verify-e9e4cd

permissions:
  contents: read

concurrency:
  group: machina-private-source-verify-e9e4cd
  cancel-in-progress: true

jobs:
  verify:
    name: fos-003-workspace-cli-diagnostic
    if: github.repository == 'r-sudo-jeferson/Machina' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: golang:1.27.1@sha256:512690a5660563b57d37ecc31129e7f136e831db2aed24a1dbeb8ad7380dc0fa
    env:
      MACHINA_GITLAB_REPOSITORY: https://gitlab.com/machina-group/machina.git
      MACHINA_GITLAB_SOURCE_SHA: 53101ef3623dcef6a06d03aeb8f2cf8d1b2d192b4b349ce2833ae23253b646a4

    steps:
      - name: Trust and exact private checkout
        shell: bash
        env:
          MACHINA_GITLAB_READ_USERNAME: ${{ secrets.MACHINA_GITLAB_READ_USERNAME }}
          MACHINA_GITLAB_READ_TOKEN: ${{ secrets.MACHINA_GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          src="$RUNNER_TEMP/private-source"
          askpass="$RUNNER_TEMP/machina-git-askpass.sh"
          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$MACHINA_GITLAB_READ_USERNAME" ;;
            *Password*) printf '%s\n' "$MACHINA_GITLAB_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none --no-checkout "$MACHINA_GITLAB_REPOSITORY" "$src" >/dev/null 2>&1
          cd "$src"
          git fetch --depth=1 origin "$MACHINA_GITLAB_SOURCE_SHA" >/dev/null 2>&1
          git checkout --detach "$MACHINA_GITLAB_SOURCE_SHA" >/dev/null 2>&1
          test "$(git rev-parse HEAD)" = "$MACHINA_GITLAB_SOURCE_SHA"
          echo "SOURCE_IDENTITY=PASS gitlabCommitSha=$MACHINA_GITLAB_SOURCE_SHA"

      - name: Run sanitized workspace CLI diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          go test ./tools/contractctl -run '^TestRunWorkspaceVerify' -count=1 -v

      - name: Destroy ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/private-source"
          rm -f "$RUNNER_TEMP/machina-git-askpass.sh"
          test ! -e "$RUNNER_TEMP/private-source"
          test ! -e "$RUNNER_TEMP/machina-git-askpass.sh"
          echo "EPHEMERAL_WORKSPACE_DESTROYED=PASS"
