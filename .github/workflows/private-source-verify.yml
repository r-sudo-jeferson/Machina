name: Machina Authorization RED Diagnose

on:
  push:
    branches:
      - forge/private-source-verify-e9e4cd

permissions:
  contents: read

concurrency:
  group: machina-private-source-verify-e9e4cd
  cancel-in-progress: true

jobs:
  verify:
    name: authorization-red-diagnose
    if: github.repository == 'r-sudo-jeferson/Machina' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: golang:1.27.1@sha256:512690a5660563b57d37ecc31129e7f136e831db2aed24a1dbeb8ad7380dc0fa
    env:
      MACHINA_GITLAB_REPOSITORY: https://gitlab.com/machina-group/machina.git
      MACHINA_GITLAB_SOURCE_SHA: c40f3a4ca26ed26bc679751435eeae5810fd8c42ffcb4d6240c36a27c3784714

    steps:
      - name: Trust and exact private checkout
        shell: bash
        env:
          MACHINA_GITLAB_READ_USERNAME: ${{ secrets.MACHINA_GITLAB_READ_USERNAME }}
          MACHINA_GITLAB_READ_TOKEN: ${{ secrets.MACHINA_GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/forge/private-source-verify-e9e4cd"
          test -n "${MACHINA_GITLAB_READ_USERNAME:-}"
          test -n "${MACHINA_GITLAB_READ_TOKEN:-}"
          umask 077
          src="$RUNNER_TEMP/private-source"
          askpass="$RUNNER_TEMP/machina-git-askpass.sh"
          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$MACHINA_GITLAB_READ_USERNAME" ;;
            *Password*) printf '%s\n' "$MACHINA_GITLAB_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none --no-checkout "$MACHINA_GITLAB_REPOSITORY" "$src" >"$RUNNER_TEMP/fetch.log" 2>&1
          cd "$src"
          git fetch --depth=1 origin "$MACHINA_GITLAB_SOURCE_SHA" >>"$RUNNER_TEMP/fetch.log" 2>&1
          git checkout --detach "$MACHINA_GITLAB_SOURCE_SHA" >>"$RUNNER_TEMP/fetch.log" 2>&1
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$MACHINA_GITLAB_SOURCE_SHA"
          echo "SOURCE_IDENTITY=PASS gitlabCommitSha=$observed"

      - name: Confirm expected TDD RED
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          log="$RUNNER_TEMP/authorization-red.log"
          set +e
          go test ./tools/contractctl/internal/authorization -count=1 >"$log" 2>&1
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo "::error title=UNEXPECTED_GREEN::Authorization test unexpectedly passed before implementation."
            exit 1
          fi
          missing_input=false
          missing_digest=false
          grep -q 'undefined: AuthorizationInput' "$log" && missing_input=true
          grep -q 'undefined: DigestV1' "$log" && missing_digest=true
          echo "RED_MISSING_AUTHORIZATION_INPUT=$missing_input"
          echo "RED_MISSING_DIGEST_V1=$missing_digest"
          if [[ "$missing_input" != true || "$missing_digest" != true ]]; then
            echo "::error title=UNEXPECTED_RED::Authorization tests failed for a cause other than the expected missing implementation."
            exit 1
          fi
          echo "EXPECTED_TDD_RED=PASS"
          exit 1

      - name: Destroy ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/private-source"
          rm -f "$RUNNER_TEMP/machina-git-askpass.sh" "$RUNNER_TEMP/fetch.log" "$RUNNER_TEMP/authorization-red.log"
          echo "EPHEMERAL_WORKSPACE_DESTROYED=PASS"
