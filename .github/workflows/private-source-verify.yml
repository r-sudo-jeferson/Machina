name: Machina Workspace Manifest RED Diagnose

on:
  push:
    branches:
      - forge/private-source-verify-e9e4cd

permissions:
  contents: read

concurrency:
  group: machina-private-source-verify-e9e4cd
  cancel-in-progress: true

jobs:
  verify:
    name: workspace-manifest-red-diagnose
    if: github.repository == 'r-sudo-jeferson/Machina' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: golang:1.27.1@sha256:512690a5660563b57d37ecc31129e7f136e831db2aed24a1dbeb8ad7380dc0fa
    env:
      MACHINA_GITLAB_REPOSITORY: https://gitlab.com/machina-group/machina.git
      MACHINA_GITLAB_SOURCE_SHA: 900f74c2f59a6c76d23d6d2dae1762712c2dd3ac95ea350b8fac9a206931569d

    steps:
      - name: Trust and exact private checkout
        shell: bash
        env:
          MACHINA_GITLAB_READ_USERNAME: ${{ secrets.MACHINA_GITLAB_READ_USERNAME }}
          MACHINA_GITLAB_READ_TOKEN: ${{ secrets.MACHINA_GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/forge/private-source-verify-e9e4cd"
          test -n "${MACHINA_GITLAB_READ_USERNAME:-}"
          test -n "${MACHINA_GITLAB_READ_TOKEN:-}"
          umask 077
          src="$RUNNER_TEMP/private-source"
          askpass="$RUNNER_TEMP/machina-git-askpass.sh"
          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$MACHINA_GITLAB_READ_USERNAME" ;;
            *Password*) printf '%s\n' "$MACHINA_GITLAB_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none --no-checkout "$MACHINA_GITLAB_REPOSITORY" "$src" >"$RUNNER_TEMP/fetch.log" 2>&1
          cd "$src"
          git fetch --depth=1 origin "$MACHINA_GITLAB_SOURCE_SHA" >>"$RUNNER_TEMP/fetch.log" 2>&1
          git checkout --detach "$MACHINA_GITLAB_SOURCE_SHA" >>"$RUNNER_TEMP/fetch.log" 2>&1
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$MACHINA_GITLAB_SOURCE_SHA"
          echo "SOURCE_IDENTITY=PASS gitlabCommitSha=$observed"

      - name: Confirm expected TDD RED
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          log="$RUNNER_TEMP/workspace-manifest-red.log"
          set +e
          go test ./tools/contractctl/internal/workspace -count=1 >"$log" 2>&1
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo "::error title=UNEXPECTED_GREEN::Workspace manifest test unexpectedly passed before implementation."
            exit 1
          fi
          missing_entry=false
          missing_manifest=false
          missing_finalize=false
          grep -q 'undefined: FileEntry' "$log" && missing_entry=true
          grep -q 'undefined: WorkspaceManifest' "$log" && missing_manifest=true
          grep -q 'undefined: FinalizeManifest' "$log" && missing_finalize=true
          echo "RED_MISSING_FILE_ENTRY=$missing_entry"
          echo "RED_MISSING_WORKSPACE_MANIFEST=$missing_manifest"
          echo "RED_MISSING_FINALIZE_MANIFEST=$missing_finalize"
          if [[ "$missing_entry" != true || "$missing_manifest" != true || "$missing_finalize" != true ]]; then
            echo "::error title=UNEXPECTED_RED::Workspace manifest tests failed for a cause other than the expected missing implementation."
            exit 1
          fi
          echo "EXPECTED_TDD_RED=PASS"
          exit 1

      - name: Destroy ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/private-source"
          rm -f "$RUNNER_TEMP/machina-git-askpass.sh" "$RUNNER_TEMP/fetch.log" "$RUNNER_TEMP/workspace-manifest-red.log"
          echo "EPHEMERAL_WORKSPACE_DESTROYED=PASS"
