name: Machina FOS-003 Execution Contract GREEN Verify

on:
  push:
    branches:
      - forge/private-source-verify-e9e4cd

permissions:
  contents: read

concurrency:
  group: machina-private-source-verify-e9e4cd
  cancel-in-progress: true

jobs:
  verify:
    name: fos-003-execution-contract-green-verify
    if: github.repository == 'r-sudo-jeferson/Machina' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: golang:1.27.1@sha256:512690a5660563b57d37ecc31129e7f136e831db2aed24a1dbeb8ad7380dc0fa
    env:
      MACHINA_GITLAB_REPOSITORY: https://gitlab.com/machina-group/machina.git
      MACHINA_GITLAB_SOURCE_SHA: 5c33964cf543a18842ba5b70288a30149692fcf756a9e80e72031180e733444b

    steps:
      - name: Trust and exact private checkout
        shell: bash
        env:
          MACHINA_GITLAB_READ_USERNAME: ${{ secrets.MACHINA_GITLAB_READ_USERNAME }}
          MACHINA_GITLAB_READ_TOKEN: ${{ secrets.MACHINA_GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/forge/private-source-verify-e9e4cd"
          test -n "${MACHINA_GITLAB_READ_USERNAME:-}"
          test -n "${MACHINA_GITLAB_READ_TOKEN:-}"
          umask 077
          src="$RUNNER_TEMP/private-source"
          askpass="$RUNNER_TEMP/machina-git-askpass.sh"
          fetch_log="$RUNNER_TEMP/fetch.log"
          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$MACHINA_GITLAB_READ_USERNAME" ;;
            *Password*) printf '%s\n' "$MACHINA_GITLAB_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none --no-checkout "$MACHINA_GITLAB_REPOSITORY" "$src" >"$fetch_log" 2>&1
          cd "$src"
          git fetch --depth=1 origin "$MACHINA_GITLAB_SOURCE_SHA" >>"$fetch_log" 2>&1
          git checkout --detach "$MACHINA_GITLAB_SOURCE_SHA" >>"$fetch_log" 2>&1
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$MACHINA_GITLAB_SOURCE_SHA"
          echo "SOURCE_IDENTITY=PASS gitlabCommitSha=$observed"

      - name: Verify pinned Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          observed="$(go version | awk '{print $3}')"
          test "$observed" = "go1.27.1"
          echo "TOOLCHAIN=PASS version=$observed"

      - name: Assert clean baseline
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --quiet
          git diff --cached --quiet
          echo "CLEAN_TREE_BASELINE=PASS"

      - name: Download modules without mutation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          go mod download >"$RUNNER_TEMP/go-mod-download.log" 2>&1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --quiet
          git diff --cached --quiet
          echo "MODULE_DOWNLOAD=PASS"
          echo "CLEAN_TREE_AFTER_MODULE_DOWNLOAD=PASS"

      - name: Run FOS-003 workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          go test ./tools/contractctl/internal/workspace -count=1 >"$RUNNER_TEMP/fos-003-workspace.log" 2>&1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --quiet
          git diff --cached --quiet
          echo "FOS003_WORKSPACE_TEST=PASS"
          echo "CLEAN_TREE_AFTER_FOS003_WORKSPACE_TEST=PASS"

      - name: Run full product tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          go test ./... -count=1 >"$RUNNER_TEMP/go-test.log" 2>&1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --quiet
          git diff --cached --quiet
          echo "GO_TEST=PASS"
          echo "CLEAN_TREE_AFTER_GO_TEST=PASS"

      - name: Run race detector
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          go test -race ./... -count=1 >"$RUNNER_TEMP/go-race.log" 2>&1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --quiet
          git diff --cached --quiet
          echo "GO_RACE=PASS"
          echo "CLEAN_TREE_AFTER_GO_RACE=PASS"

      - name: Run go vet
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          go vet ./... >"$RUNNER_TEMP/go-vet.log" 2>&1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --quiet
          git diff --cached --quiet
          echo "GO_VET=PASS"
          echo "CLEAN_TREE_AFTER_GO_VET=PASS"

      - name: Destroy ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/private-source"
          rm -f "$RUNNER_TEMP/machina-git-askpass.sh" "$RUNNER_TEMP/fetch.log" "$RUNNER_TEMP/go-mod-download.log" "$RUNNER_TEMP/fos-003-workspace.log" "$RUNNER_TEMP/go-test.log" "$RUNNER_TEMP/go-race.log" "$RUNNER_TEMP/go-vet.log"
          test ! -e "$RUNNER_TEMP/private-source"
          test ! -e "$RUNNER_TEMP/machina-git-askpass.sh"
          echo "EPHEMERAL_WORKSPACE_DESTROYED=PASS"
