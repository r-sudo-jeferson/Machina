name: Machina Private Source Verify

on:
  push:
    branches:
      - forge/private-source-verify-e9e4cd

permissions:
  contents: read

concurrency:
  group: machina-private-source-verify-e9e4cd
  cancel-in-progress: true

jobs:
  verify:
    name: private-source-verify
    if: github.repository == 'r-sudo-jeferson/Machina' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: golang:1.27.1@sha256:512690a5660563b57d37ecc31129e7f136e831db2aed24a1dbeb8ad7380dc0fa
    env:
      MACHINA_GITLAB_REPOSITORY: https://gitlab.com/machina-group/machina.git
      MACHINA_GITLAB_SOURCE_SHA: e9e4cd527749b4e8b17fd7076e4c1f0228adba42847121781a2c4fc1463a1d74

    steps:
      - name: Trust and credential preflight
        shell: bash
        env:
          MACHINA_GITLAB_READ_USERNAME: ${{ secrets.MACHINA_GITLAB_READ_USERNAME }}
          MACHINA_GITLAB_READ_TOKEN: ${{ secrets.MACHINA_GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/forge/private-source-verify-e9e4cd"
          if [[ -z "${MACHINA_GITLAB_READ_USERNAME:-}" || -z "${MACHINA_GITLAB_READ_TOKEN:-}" ]]; then
            echo "::error title=AUTH_INPUTS_MISSING::Trusted read-only GitLab checkout credential is not configured."
            exit 78
          fi
          echo "TRUST_CONTEXT=PASS"

      - name: Fetch exact private GitLab source
        shell: bash
        env:
          MACHINA_GITLAB_READ_USERNAME: ${{ secrets.MACHINA_GITLAB_READ_USERNAME }}
          MACHINA_GITLAB_READ_TOKEN: ${{ secrets.MACHINA_GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          src="$RUNNER_TEMP/private-source"
          askpass="$RUNNER_TEMP/machina-git-askpass.sh"
          fetch_log="$RUNNER_TEMP/machina-source-fetch.log"

          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$MACHINA_GITLAB_READ_USERNAME" ;;
            *Password*) printf '%s\n' "$MACHINA_GITLAB_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          git clone --filter=blob:none --no-checkout "$MACHINA_GITLAB_REPOSITORY" "$src" >"$fetch_log" 2>&1
          cd "$src"
          git fetch --depth=1 origin "$MACHINA_GITLAB_SOURCE_SHA" >>"$fetch_log" 2>&1
          git checkout --detach "$MACHINA_GITLAB_SOURCE_SHA" >>"$fetch_log" 2>&1

          observed="$(git rev-parse HEAD)"
          if [[ "$observed" != "$MACHINA_GITLAB_SOURCE_SHA" ]]; then
            echo "::error title=SOURCE_IDENTITY_MISMATCH::Fetched source identity does not equal the authorized immutable GitLab SHA."
            exit 1
          fi
          echo "SOURCE_IDENTITY=PASS gitlabCommitSha=$observed"

      - name: Recover corrected module lock encrypted
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          git diff --quiet --exit-code
          echo "CLEAN_TREE_BASELINE=PASS"

          go mod download >"$RUNNER_TEMP/machina-MODULE_DOWNLOAD.log" 2>&1
          echo "MODULE_DOWNLOAD=PASS"

          manifest_changed=false
          lock_changed=false
          other_changed=false
          git diff --quiet --exit-code -- go.mod || manifest_changed=true
          git diff --quiet --exit-code -- go.sum || lock_changed=true
          git diff --quiet --exit-code -- . ':(exclude)go.mod' ':(exclude)go.sum' || other_changed=true

          echo "MODULE_MANIFEST_CHANGED=$manifest_changed"
          echo "MODULE_LOCK_CHANGED=$lock_changed"
          echo "OTHER_TRACKED_CHANGED=$other_changed"

          if [[ "$manifest_changed" != false || "$lock_changed" != true || "$other_changed" != false ]]; then
            echo "::error title=UNEXPECTED_MUTATION_SHAPE::Expected only the module lock to change."
            exit 1
          fi

          pub="$RUNNER_TEMP/machina-recovery-public.pem"
          helper="$RUNNER_TEMP/machina-encrypt-lock.go"
          cat >"$pub" <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAjJwqvPHLqRZWfpXUp8Gy
          mlvBflhSlvtUb97URt77424lTA2X/A16snyWp9r5828tVkgmFXphgwwx1321AxiW
          sQhx1KhD6HTnwUuHBR+HNerPR7oqd/0QdMm3ozr0zHbLCpCeFqtkM6ndJUXJfTMf
          2b+4M3Llg0D2xt/mLZDZoYJrKLogoCaJAP//aax97a+b+xyq63+u7WHskscmKzVu
          XQYfazfGX1ph07ktTt3XPJ9FuFgdVNjWVfcWfL0QmKMO6NI0SSryTDKb/A3osC4W
          5Y/g2FWKBz4yK1q0Ol84xYHfeVrwA+FjC5OF4E6Nfvs4wmWN4NRzj3fDA2GJtSx6
          F/SQyAWq8BzUullmTszJKsS2L66F9zjXMAq2IIHytStct9uQjCgdOlMuNnCobzsz
          PfVGPMEFVARAz/bykIx9iiwW0S8UMCvDUaaTGL3KJzyjTkh9vC4K3fYBFehap1IU
          0YiIN5N811WWJ3wrd8CX458RdbIaOdwf2LRJVQIQ2WTK89Tpn+mp6ThIE6wCm5/n
          icX0b8hgO2vaPnW2Kb3pSw5zDVa2oQvneriBGuujpCfsADvkiraBLn29FjJOEUyA
          OA2XNKEaY1kwsk4KXNvvFD7epWFW/PWloGen9hVSHQHrmNFVLl0EurN4b6BRjzSI
          cC0NKtv4tcEAKhh61Jk5Hs8CAwEAAQ==
          -----END PUBLIC KEY-----
          EOF

          cat >"$helper" <<'EOF'
          package main
          import (
            "crypto/rand"
            "crypto/rsa"
            "crypto/sha256"
            "crypto/x509"
            "encoding/base64"
            "encoding/hex"
            "encoding/pem"
            "fmt"
            "os"
          )
          func main() {
            pubPEM, err := os.ReadFile(os.Args[1]); if err != nil { panic(err) }
            data, err := os.ReadFile(os.Args[2]); if err != nil { panic(err) }
            block, _ := pem.Decode(pubPEM); if block == nil { panic("public key pem") }
            anyKey, err := x509.ParsePKIXPublicKey(block.Bytes); if err != nil { panic(err) }
            pub, ok := anyKey.(*rsa.PublicKey); if !ok { panic("rsa public key") }
            sum := sha256.Sum256(data)
            fmt.Printf("LOCK_BYTES=%d\n", len(data))
            fmt.Printf("LOCK_SHA256=%s\n", hex.EncodeToString(sum[:]))
            max := pub.Size() - 2*sha256.Size - 2
            for i, off := 0, 0; off < len(data); i++ {
              end := off + max; if end > len(data) { end = len(data) }
              enc, err := rsa.EncryptOAEP(sha256.New(), rand.Reader, pub, data[off:end], nil); if err != nil { panic(err) }
              fmt.Printf("LOCK_CIPHERTEXT_CHUNK_%03d=%s\n", i, base64.StdEncoding.EncodeToString(enc))
              off = end
            }
          }
          EOF

          go run "$helper" "$pub" go.sum
          echo "ENCRYPTED_LOCK_RECOVERY=PASS"
          exit 1

      - name: Destroy ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/private-source"
          rm -f "$RUNNER_TEMP/machina-git-askpass.sh"
          rm -f "$RUNNER_TEMP/machina-source-fetch.log"
          rm -f "$RUNNER_TEMP/machina-MODULE_DOWNLOAD.log"
          rm -f "$RUNNER_TEMP/machina-recovery-public.pem"
          rm -f "$RUNNER_TEMP/machina-encrypt-lock.go"
          echo "EPHEMERAL_WORKSPACE_DESTROYED=PASS"
