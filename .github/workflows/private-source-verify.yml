name: Machina FOS-003 Exporter RED Verify

on:
  push:
    branches:
      - forge/private-source-verify-e9e4cd

permissions:
  contents: read

concurrency:
  group: machina-private-source-verify-e9e4cd
  cancel-in-progress: true

jobs:
  verify:
    name: fos-003-exporter-red-verify
    if: github.repository == 'r-sudo-jeferson/Machina' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: golang:1.27.1@sha256:512690a5660563b57d37ecc31129e7f136e831db2aed24a1dbeb8ad7380dc0fa
    env:
      MACHINA_GITLAB_REPOSITORY: https://gitlab.com/machina-group/machina.git
      MACHINA_GITLAB_SOURCE_SHA: f65a9ad6a9a143783cc77ec4e2e9f5a571775fc5a2297223266a82b56150a223

    steps:
      - name: Trust and exact private checkout
        shell: bash
        env:
          MACHINA_GITLAB_READ_USERNAME: ${{ secrets.MACHINA_GITLAB_READ_USERNAME }}
          MACHINA_GITLAB_READ_TOKEN: ${{ secrets.MACHINA_GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/forge/private-source-verify-e9e4cd"
          test -n "${MACHINA_GITLAB_READ_USERNAME:-}"
          test -n "${MACHINA_GITLAB_READ_TOKEN:-}"
          umask 077
          src="$RUNNER_TEMP/private-source"
          askpass="$RUNNER_TEMP/machina-git-askpass.sh"
          fetch_log="$RUNNER_TEMP/fetch.log"
          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$MACHINA_GITLAB_READ_USERNAME" ;;
            *Password*) printf '%s\n' "$MACHINA_GITLAB_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none --no-checkout "$MACHINA_GITLAB_REPOSITORY" "$src" >"$fetch_log" 2>&1
          cd "$src"
          git fetch --depth=1 origin "$MACHINA_GITLAB_SOURCE_SHA" >>"$fetch_log" 2>&1
          git checkout --detach "$MACHINA_GITLAB_SOURCE_SHA" >>"$fetch_log" 2>&1
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$MACHINA_GITLAB_SOURCE_SHA"
          echo "SOURCE_IDENTITY=PASS gitlabCommitSha=$observed"

      - name: Verify pinned Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          observed="$(go version | awk '{print $3}')"
          test "$observed" = "go1.27.1"
          echo "TOOLCHAIN=PASS version=$observed"

      - name: Confirm expected FOS-003 TDD RED
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          log="$RUNNER_TEMP/fos-003-red.log"
          set +e
          go test ./tools/contractctl/internal/workspace -count=1 >"$log" 2>&1
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo "::error title=UNEXPECTED_GREEN::FOS-003 adversarial exporter tests unexpectedly passed before implementation."
            exit 1
          fi
          missing_policy=false
          missing_collect=false
          missing_mode=false
          grep -q 'undefined: ExportPolicy' "$log" && missing_policy=true
          grep -q 'undefined: CollectTrackedEntries' "$log" && missing_collect=true
          grep -q 'undefined: validateSourceMode' "$log" && missing_mode=true
          echo "RED_MISSING_EXPORT_POLICY=$missing_policy"
          echo "RED_MISSING_COLLECT_TRACKED_ENTRIES=$missing_collect"
          echo "RED_MISSING_VALIDATE_SOURCE_MODE=$missing_mode"
          if [[ "$missing_policy" != true || "$missing_collect" != true || "$missing_mode" != true ]]; then
            echo "::error title=UNEXPECTED_RED::FOS-003 tests failed for a cause other than the expected missing implementation."
            exit 1
          fi
          echo "EXPECTED_TDD_RED=PASS"
          exit 1

      - name: Destroy ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/private-source"
          rm -f "$RUNNER_TEMP/machina-git-askpass.sh" "$RUNNER_TEMP/fetch.log" "$RUNNER_TEMP/fos-003-red.log"
          test ! -e "$RUNNER_TEMP/private-source"
          test ! -e "$RUNNER_TEMP/machina-git-askpass.sh"
          echo "EPHEMERAL_WORKSPACE_DESTROYED=PASS"
