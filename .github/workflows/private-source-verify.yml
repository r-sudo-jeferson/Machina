name: Machina FOS-003 Execution Contract RED Verify

on:
  push:
    branches:
      - forge/private-source-verify-e9e4cd

permissions:
  contents: read

concurrency:
  group: machina-private-source-verify-e9e4cd
  cancel-in-progress: true

jobs:
  verify:
    name: fos-003-execution-contract-red-verify
    if: github.repository == 'r-sudo-jeferson/Machina' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: golang:1.27.1@sha256:512690a5660563b57d37ecc31129e7f136e831db2aed24a1dbeb8ad7380dc0fa
    env:
      MACHINA_GITLAB_REPOSITORY: https://gitlab.com/machina-group/machina.git
      MACHINA_GITLAB_SOURCE_SHA: 73caf0e376ca899ee1da013a1136531b209592fd1a16c074808cf950235c8a61

    steps:
      - name: Trust and exact private checkout
        shell: bash
        env:
          MACHINA_GITLAB_READ_USERNAME: ${{ secrets.MACHINA_GITLAB_READ_USERNAME }}
          MACHINA_GITLAB_READ_TOKEN: ${{ secrets.MACHINA_GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/forge/private-source-verify-e9e4cd"
          test -n "${MACHINA_GITLAB_READ_USERNAME:-}"
          test -n "${MACHINA_GITLAB_READ_TOKEN:-}"
          umask 077
          src="$RUNNER_TEMP/private-source"
          askpass="$RUNNER_TEMP/machina-git-askpass.sh"
          fetch_log="$RUNNER_TEMP/fetch.log"
          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$MACHINA_GITLAB_READ_USERNAME" ;;
            *Password*) printf '%s\n' "$MACHINA_GITLAB_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none --no-checkout "$MACHINA_GITLAB_REPOSITORY" "$src" >"$fetch_log" 2>&1
          cd "$src"
          git fetch --depth=1 origin "$MACHINA_GITLAB_SOURCE_SHA" >>"$fetch_log" 2>&1
          git checkout --detach "$MACHINA_GITLAB_SOURCE_SHA" >>"$fetch_log" 2>&1
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$MACHINA_GITLAB_SOURCE_SHA"
          echo "SOURCE_IDENTITY=PASS gitlabCommitSha=$observed"

      - name: Verify pinned Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          observed="$(go version | awk '{print $3}')"
          test "$observed" = "go1.27.1"
          echo "TOOLCHAIN=PASS version=$observed"

      - name: Confirm expected execution contract TDD RED
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          log="$RUNNER_TEMP/fos-003-execution-contract-red.log"
          set +e
          go test ./tools/contractctl/internal/workspace -count=1 >"$log" 2>&1
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo "::error title=UNEXPECTED_GREEN::Execution contract tests unexpectedly passed before implementation."
            exit 1
          fi
          missing_contract=false
          missing_finalize=false
          grep -q 'undefined: ExecutionContract' "$log" && missing_contract=true
          grep -q 'undefined: FinalizeExecutionContract' "$log" && missing_finalize=true
          echo "RED_MISSING_EXECUTION_CONTRACT=$missing_contract"
          echo "RED_MISSING_FINALIZE_EXECUTION_CONTRACT=$missing_finalize"
          if [[ "$missing_contract" != true || "$missing_finalize" != true ]]; then
            echo "::error title=UNEXPECTED_RED::Canonical Step 4 tests failed for a cause other than the expected missing execution-contract implementation."
            exit 1
          fi
          echo "CANONICAL_STEP4_RED=PASS"

      - name: Isolate missing ExportRequest Contract field
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          test_file="tools/contractctl/internal/workspace/execution_contract_test.go"
          saved="$RUNNER_TEMP/execution_contract_test.go"
          probe="tools/contractctl/internal/workspace/contract_field_probe_test.go"
          probe_log="$RUNNER_TEMP/contract-field-probe.log"
          mv "$test_file" "$saved"
          cat >"$probe" <<'EOF'
          package workspace
          var _ = ExportRequest{Contract: struct{}{}}
          EOF
          set +e
          go test ./tools/contractctl/internal/workspace -run '^$' -count=1 >"$probe_log" 2>&1
          rc=$?
          set -e
          field_missing=false
          grep -q 'unknown field Contract in struct literal of type ExportRequest' "$probe_log" && field_missing=true
          rm -f "$probe"
          mv "$saved" "$test_file"
          echo "RED_MISSING_EXPORT_REQUEST_CONTRACT=$field_missing"
          if [[ $rc -eq 0 || "$field_missing" != true ]]; then
            echo "::error title=UNEXPECTED_PROBE_RESULT::ExportRequest Contract-field probe did not fail for the expected missing field."
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --quiet
          git diff --cached --quiet
          echo "EXPECTED_TDD_RED=PASS"
          echo "CLEAN_TREE_AFTER_RED_PROBE=PASS"
          exit 1

      - name: Destroy ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/private-source"
          rm -f "$RUNNER_TEMP/machina-git-askpass.sh" "$RUNNER_TEMP/fetch.log" "$RUNNER_TEMP/fos-003-execution-contract-red.log" "$RUNNER_TEMP/contract-field-probe.log" "$RUNNER_TEMP/execution_contract_test.go"
          test ! -e "$RUNNER_TEMP/private-source"
          test ! -e "$RUNNER_TEMP/machina-git-askpass.sh"
          echo "EPHEMERAL_WORKSPACE_DESTROYED=PASS"
