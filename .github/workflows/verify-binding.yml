name: Verify platform construction

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/**/*.go'
      - 'job/go.mod'
      - 'job/go.sum'
      - 'job/db/**'
      - 'job/contracts/**'
      - 'job/scripts/dbtest/**'
      - 'job/scripts/sqltest/**'
      - 'job/scripts/contracts/**'
      - 'job/scripts/verify/**'
      - '.github/workflows/verify-binding.yml'

permissions:
  contents: read

concurrency:
  group: verify-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go module is canonical
        working-directory: job
        run: go mod tidy -diff

      - name: Verify Go and repository contracts
        working-directory: job
        run: |
          set -euo pipefail
          go test -count=1 ./scripts/verify/...
          go test -count=1 ./...

      - name: Verify PostgreSQL 18.6 tenancy and identity kernel
        working-directory: job
        run: bash scripts/dbtest/run.sh

      - name: Verify sqlc data-access contract
        working-directory: job
        run: bash scripts/sqltest/run.sh
