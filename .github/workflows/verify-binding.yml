name: Verify FORGE binding

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify binding compatibility contract
        working-directory: job
        run: go test ./scripts/verify/...
