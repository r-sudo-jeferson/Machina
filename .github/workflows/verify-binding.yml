name: Verify repository contract

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go module is canonical
        working-directory: job
        run: go mod tidy -diff

      - name: Verify repository policy contracts
        working-directory: job
        run: |
          go test -count=1 ./scripts/verify/...
          go test -count=1 ./...

      - name: Verify PostgreSQL 18.6 tenancy kernel
        working-directory: job
        run: bash scripts/dbtest/run.sh

      - name: Setup Node 24.20.0 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          cache: ''

      - name: Verify pnpm workspace lock
        working-directory: job
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          test "$(node --version)" = "v24.20.0"
          test "$(pnpm --version)" = "12.3.4"
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Rust workspace manifest
        working-directory: job
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.98.1 --component clippy --component rustfmt
          rustc +1.98.1 --version
          cargo +1.98.1 metadata --format-version 1 --no-deps >/dev/null
