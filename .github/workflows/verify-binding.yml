name: Verify Go construction

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/**/*.go'
      - 'job/go.mod'
      - 'job/go.sum'
      - 'job/contracts/**'
      - 'job/scripts/contracts/**'
      - 'job/scripts/verify/**'
      - '.github/workflows/verify-binding.yml'

permissions:
  contents: read

concurrency:
  group: verify-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go module is canonical
        working-directory: job
        run: go mod tidy -diff

      - name: Verify Go formatting and static analysis
        working-directory: job
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...

      - name: Verify Go and repository contracts
        working-directory: job
        run: |
          set -euo pipefail
          go test -count=1 ./scripts/verify/...
          go test -count=1 ./...

      - name: Verify race safety for metric wiring
        working-directory: job
        run: go test -race -count=1 ./internal/platform/observability ./internal/platform/identity
