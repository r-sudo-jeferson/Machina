name: Verify web entry journey

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/apps/web/**'
      - 'job/packages/alloy/**'
      - 'job/package.json'
      - 'job/pnpm-workspace.yaml'
      - 'job/pnpm-lock.yaml'
      - 'job/toolchains.lock.json'
      - '.github/workflows/verify-web.yml'

permissions:
  contents: read

concurrency:
  group: verify-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout construction ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checked ref identity
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          printf 'workflow_sha=%s\n' "$GITHUB_SHA"
          printf 'checked_sha=%s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"

      - name: Setup Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Activate pnpm 12.3.4
        working-directory: job
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          test "$(pnpm --version)" = "12.3.4"

      - name: Install frozen workspace
        working-directory: job
        run: pnpm install --frozen-lockfile

      - name: Test web package first pass
        working-directory: job
        run: pnpm --filter @machina/web test

      - name: Typecheck web package
        working-directory: job
        run: pnpm --filter @machina/web typecheck

      - name: Build web package
        working-directory: job
        run: pnpm --filter @machina/web build

      - name: Test web package second pass
        working-directory: job
        run: pnpm --filter @machina/web test
