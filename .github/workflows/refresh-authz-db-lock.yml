name: Refresh authz database lock temporary

on:
  push:
    branches:
      - forge/mch-s001-1.0.0
    paths:
      - 'job/services/authz/Cargo.toml'
      - 'job/Cargo.lock'
      - '.github/workflows/refresh-authz-db-lock.yml'

permissions:
  contents: write

concurrency:
  group: refresh-authz-db-lock
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout construction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: forge/mch-s001-1.0.0
          fetch-depth: 1

      - name: Refresh, verify, and commit only Cargo.lock
        working-directory: job
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.98.1

          cargo +1.98.1 metadata --format-version 1 >/dev/null
          cargo +1.98.1 metadata --locked --format-version 1 >/dev/null
          cargo +1.98.1 tree --locked -p machina-authz >/dev/null
          git diff --check -- Cargo.lock

          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock is already current'
            exit 0
          fi

          if git diff --unified=0 -- Cargo.lock | grep '^-' | grep -v '^---'; then
            echo 'Cargo.lock refresh attempted to delete an existing lock entry' >&2
            exit 1
          fi

          grep -F 'name = "tokio-postgres"' Cargo.lock >/dev/null
          grep -F 'name = "tokio-postgres-rustls"' Cargo.lock >/dev/null
          grep -F 'name = "rustls"' Cargo.lock >/dev/null
          grep -F 'name = "webpki-roots"' Cargo.lock >/dev/null

          changed="$(git status --porcelain --untracked-files=no -- Cargo.lock)"
          test "$changed" = ' M Cargo.lock'

          git config user.name 'forge-engineering'
          git config user.email 'forge-engineering@users.noreply.github.com'
          git add Cargo.lock
          staged="$(git diff --cached --name-only --relative)"
          test "$staged" = 'Cargo.lock'
          git commit -m 'build(authz): lock PostgreSQL policy-source dependencies'
          git push origin HEAD:forge/mch-s001-1.0.0
